<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Admin — Cresce Forte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .cf-page { min-height: 100vh; background: #eff4f5; font-family: Inter, sans-serif; }
  .cf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding: 14px clamp(20px, 4vw, 56px);
    background: #f4f8f9;
    border-bottom: 1px solid rgba(13,43,62,0.1);
  }
  .cf-brand { display: flex; align-items: center; gap: 10px; }
  .cf-logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    background: #fff;
    border: 1px solid rgba(13,43,62,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    box-shadow: 0 1px 2px rgba(13,43,62,0.06);
  }
  .cf-logo-mark img { width: 100%; height: 100%; object-fit: contain; }
  .cf-brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.01em;
    color: #0d2b3e;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cf-badge {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #4f8a00;
    background: rgba(124,182,2,0.12);
    padding: 4px 9px;
    border-radius: 999px;
    margin-left: 4px;
  }
  .cf-user-area { display: flex; align-items: center; gap: 16px; }
  .cf-user-email { font-size: 13.5px; color: #56707e; }
  .cf-logout {
    font-size: 13.5px;
    font-weight: 600;
    color: #3d5768;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(13,43,62,0.15);
    background: none;
    cursor: pointer;
    font-family: Inter, sans-serif;
  }
  .cf-logout:hover { border-color: rgba(13,43,62,0.35); color: #0d2b3e; }
  main.cf-main {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(40px, 6vw, 64px) clamp(20px, 4vw, 56px);
  }
  main.cf-main h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 3vw, 32px);
    color: #0d2b3e;
    margin: 0 0 8px;
  }
  main.cf-main p.cf-sub { font-size: 15px; color: #56707e; margin: 0 0 36px; }

  .cf-card {
    background: #fff;
    border: 1px solid rgba(13,43,62,0.1);
    border-radius: 20px;
    box-shadow: 0 2px 6px -1px rgba(13,43,62,0.06), 0 14px 32px -14px rgba(13,43,62,0.16);
    overflow: hidden;
  }
  .cf-card-head { padding: 24px 28px 20px; }
  .cf-card-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: #0d2b3e;
    margin: 0 0 4px;
  }
  .cf-card-head p { font-size: 13.5px; color: #56707e; margin: 0; }

  .cf-loading, .cf-error-text {
    padding: 4px 28px 28px;
    font-size: 13.5px;
    color: #56707e;
    margin: 0;
  }
  .cf-error-text { color: #a13a2a; }

  .cf-company-row { border-top: 1px solid rgba(13,43,62,0.08); }
  .cf-company-main {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 28px;
    flex-wrap: wrap;
  }
  .cf-company-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 160px;
  }
  .cf-company-name { font-weight: 600; font-size: 14.5px; color: #0d2b3e; }
  .cf-company-legal { font-size: 12.5px; color: #56707e; }
  .cf-status-badge {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #4f8a00;
    background: rgba(124,182,2,0.12);
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .cf-status-badge.cf-status-muted { color: #56707e; background: rgba(13,43,62,0.06); }
  .cf-manage-btn {
    font-size: 13px;
    font-weight: 600;
    color: #3d5768;
    background: none;
    border: 1px solid rgba(13,43,62,0.15);
    border-radius: 999px;
    padding: 7px 15px;
    cursor: pointer;
    font-family: Inter, sans-serif;
  }
  .cf-manage-btn:hover { border-color: rgba(13,43,62,0.35); color: #0d2b3e; }

  .cf-company-services {
    padding: 4px 28px 20px;
    background: #f9fbfb;
    border-top: 1px solid rgba(13,43,62,0.08);
  }
  .cf-service-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(13,43,62,0.06);
  }
  .cf-service-row:last-child { border-bottom: none; }
  .cf-service-name { flex: 1; font-size: 13.5px; font-weight: 500; color: #0d2b3e; }
  .cf-service-msg { font-size: 12px; color: #56707e; white-space: nowrap; }
  .cf-service-msg-ok { color: #4f8a00; }
  .cf-service-msg-error { color: #a13a2a; }

  .cf-toggle { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
  .cf-toggle input {
    position: absolute;
    inset: 0;
    opacity: 0;
    margin: 0;
    cursor: pointer;
    z-index: 1;
  }
  .cf-toggle-track {
    position: absolute;
    inset: 0;
    background: rgba(13,43,62,0.18);
    border-radius: 999px;
    transition: background 0.15s ease;
  }
  .cf-toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(13,43,62,0.3);
    transition: transform 0.15s ease;
  }
  .cf-toggle input:checked + .cf-toggle-track { background: #7cb602; }
  .cf-toggle input:checked + .cf-toggle-track .cf-toggle-thumb { transform: translateX(18px); }
  .cf-toggle input:disabled { cursor: default; }
  .cf-toggle-loading .cf-toggle-track { opacity: 0.6; }
</style>
</head>
<body>
<div class="cf-page">
  <header class="cf-header">
    <div class="cf-brand">
      <span class="cf-logo-mark">
        <img src="assets/cresce-forte-icon.webp?v=1" alt="Cresce Forte">
      </span>
      <span class="cf-brand-name">Cresce Forte</span>
      <span class="cf-badge">Super Admin</span>
    </div>
    <div class="cf-user-area">
      <span class="cf-user-email" id="user-email"></span>
      <button type="button" class="cf-logout" id="logout-btn">Sair</button>
    </div>
  </header>

  <main class="cf-main">
    <h1>Painel do Super Admin</h1>
    <p class="cf-sub">Visão geral de todas as empresas na plataforma.</p>

    <div class="cf-card">
      <div class="cf-card-head">
        <h2>Empresas</h2>
        <p>Clique em "Gerenciar" para ativar ou desativar os serviços de uma empresa.</p>
      </div>
      <div id="companies-list">
        <p class="cf-loading">Carregando empresas...</p>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/auth.js"></script>
<script>
(function () {
  var supabase = CresceForteAuth.client;
  var companiesListEl = document.getElementById('companies-list');

  var STATUS_LABELS = {
    active: 'Ativa',
    inactive: 'Inativa',
    pending: 'Pendente',
    suspended: 'Suspensa'
  };

  CresceForteAuth.requireRole('PLATFORM', { loginUrl: 'login.html', fallbackUrl: 'app.html' }).then(function (session) {
    if (!session) return; // already redirected to login.html or app.html
    var emailEl = document.getElementById('user-email');
    var name = session.user.user_metadata && session.user.user_metadata.full_name;
    emailEl.textContent = name || session.user.email || '';
    loadCompanies();
  });

  document.getElementById('logout-btn').addEventListener('click', function () {
    CresceForteAuth.logout('login.html');
  });

  function formatStatus(status) {
    return STATUS_LABELS[status] || status || '—';
  }

  async function loadCompanies() {
    companiesListEl.innerHTML = '<p class="cf-loading">Carregando empresas...</p>';

    var result = await supabase
      .from('companies')
      .select('id, legal_name, trade_name, status')
      .order('trade_name', { ascending: true });

    if (result.error) {
      console.error('Erro ao carregar empresas:', result.error);
      companiesListEl.innerHTML = '<p class="cf-error-text">Não foi possível carregar as empresas. Tente recarregar a página.</p>';
      return;
    }

    var companies = result.data || [];
    if (companies.length === 0) {
      companiesListEl.innerHTML = '<p class="cf-loading">Nenhuma empresa cadastrada ainda.</p>';
      return;
    }

    companiesListEl.innerHTML = '';
    companies.forEach(function (company) {
      companiesListEl.appendChild(buildCompanyRow(company));
    });
  }

  function buildCompanyRow(company) {
    var row = document.createElement('div');
    row.className = 'cf-company-row';

    var main = document.createElement('div');
    main.className = 'cf-company-main';

    var info = document.createElement('div');
    info.className = 'cf-company-info';

    var nameEl = document.createElement('span');
    nameEl.className = 'cf-company-name';
    nameEl.textContent = company.trade_name || company.legal_name || 'Empresa sem nome';
    info.appendChild(nameEl);

    if (company.legal_name && company.legal_name !== company.trade_name) {
      var legalEl = document.createElement('span');
      legalEl.className = 'cf-company-legal';
      legalEl.textContent = company.legal_name;
      info.appendChild(legalEl);
    }
    main.appendChild(info);

    var statusEl = document.createElement('span');
    statusEl.className = 'cf-status-badge';
    if (company.status && company.status !== 'active') {
      statusEl.className += ' cf-status-muted';
    }
    statusEl.textContent = formatStatus(company.status);
    main.appendChild(statusEl);

    var manageBtn = document.createElement('button');
    manageBtn.type = 'button';
    manageBtn.className = 'cf-manage-btn';
    manageBtn.textContent = 'Gerenciar';
    main.appendChild(manageBtn);

    row.appendChild(main);

    var panel = document.createElement('div');
    panel.className = 'cf-company-services';
    panel.hidden = true;
    row.appendChild(panel);

    var loaded = false;
    manageBtn.addEventListener('click', function () {
      var willShow = panel.hidden;
      panel.hidden = !willShow;
      manageBtn.textContent = willShow ? 'Fechar' : 'Gerenciar';
      if (willShow && !loaded) {
        loaded = true;
        loadServicesForCompany(company.id, panel);
      }
    });

    return row;
  }

  async function loadServicesForCompany(companyId, panel) {
    panel.innerHTML = '<p class="cf-loading">Carregando serviços...</p>';

    var servicesResult = await supabase
      .from('services')
      .select('id, key, name')
      .order('name', { ascending: true });

    if (servicesResult.error) {
      console.error('Erro ao carregar catálogo de serviços:', servicesResult.error);
      panel.innerHTML = '<p class="cf-error-text">Não foi possível carregar os serviços.</p>';
      return;
    }

    var companyServicesResult = await supabase
      .from('company_services')
      .select('service_id, active')
      .eq('company_id', companyId);

    if (companyServicesResult.error) {
      console.error('Erro ao carregar serviços da empresa:', companyServicesResult.error);
      panel.innerHTML = '<p class="cf-error-text">Não foi possível carregar os serviços contratados.</p>';
      return;
    }

    var activeMap = {};
    (companyServicesResult.data || []).forEach(function (row) {
      activeMap[row.service_id] = !!row.active;
    });

    var services = servicesResult.data || [];
    panel.innerHTML = '';
    if (services.length === 0) {
      panel.innerHTML = '<p class="cf-loading">Nenhum serviço no catálogo ainda.</p>';
      return;
    }

    services.forEach(function (service) {
      panel.appendChild(buildServiceToggleRow(companyId, service, !!activeMap[service.id]));
    });
  }

  function buildServiceToggleRow(companyId, service, isActive) {
    var row = document.createElement('div');
    row.className = 'cf-service-row';

    var nameEl = document.createElement('span');
    nameEl.className = 'cf-service-name';
    nameEl.textContent = service.name;
    row.appendChild(nameEl);

    var msgEl = document.createElement('span');
    msgEl.className = 'cf-service-msg';
    msgEl.hidden = true;

    var toggle = document.createElement('label');
    toggle.className = 'cf-toggle';

    var input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = isActive;

    var track = document.createElement('span');
    track.className = 'cf-toggle-track';
    var thumb = document.createElement('span');
    thumb.className = 'cf-toggle-thumb';
    track.appendChild(thumb);

    toggle.appendChild(input);
    toggle.appendChild(track);

    input.addEventListener('change', function () {
      var nextActive = input.checked;
      var previousActive = !nextActive;

      input.disabled = true;
      toggle.classList.add('cf-toggle-loading');
      msgEl.hidden = true;

      var payload = {
        company_id: companyId,
        service_id: service.id,
        active: nextActive
      };
      // activated_at records the last time the service was turned ON; leave it
      // untouched when deactivating so the activation history is preserved.
      if (nextActive) {
        payload.activated_at = new Date().toISOString();
      }

      supabase
        .from('company_services')
        .upsert(payload, { onConflict: 'company_id,service_id' })
        .then(function (result) {
          input.disabled = false;
          toggle.classList.remove('cf-toggle-loading');

          if (result.error) {
            console.error('Erro ao atualizar serviço:', result.error);
            input.checked = previousActive;
            msgEl.textContent = 'Erro ao salvar. Tente novamente.';
            msgEl.className = 'cf-service-msg cf-service-msg-error';
            msgEl.hidden = false;
            return;
          }

          msgEl.textContent = 'Salvo.';
          msgEl.className = 'cf-service-msg cf-service-msg-ok';
          msgEl.hidden = false;
          setTimeout(function () { msgEl.hidden = true; }, 2500);
        });
    });

    row.appendChild(toggle);
    row.appendChild(msgEl);
    return row;
  }
})();
</script>
</body>
</html>
