<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Cresce Forte</title>
<meta name="description" content="Painel de ferramentas contratadas da sua empresa na Cresce Forte.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/cresce-forte-icon.webp?v=1" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" media="print">
<script src="/assets/font-swap.js"></script>
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/assets/dashboard-shell.css?v=1">
<style>
  .cf-placeholder {
    background: #fff;
    border: 1px solid rgba(13,43,62,0.1);
    border-radius: 20px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 2px 6px -1px rgba(13,43,62,0.06), 0 14px 32px -14px rgba(13,43,62,0.16);
    max-width: 480px;
  }
  .cf-placeholder .cf-tag {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #56707e;
    background: rgba(13,43,62,0.06);
    padding: 4px 9px;
    border-radius: 999px;
    width: fit-content;
  }
  .cf-placeholder h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: #0d2b3e;
    margin: 0;
  }
  .cf-placeholder p { font-size: 13.5px; line-height: 1.6; color: #56707e; margin: 0; }
  .cf-modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; max-width: 900px; }
  .cf-module {
    background: #fff;
    border: 1px solid rgba(13,43,62,0.1);
    border-radius: 20px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 2px 6px -1px rgba(13,43,62,0.06), 0 14px 32px -14px rgba(13,43,62,0.16);
    text-decoration: none;
  }
  .cf-module h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: #0d2b3e;
    margin: 0;
  }
  .cf-module p { font-size: 13.5px; line-height: 1.5; color: #56707e; margin: 0; }
  .cf-module .cf-open {
    font-size: 13px;
    font-weight: 700;
    color: #0f7c8c;
  }
</style>
</head>
<body>
<div class="cf-page">
  <header class="cf-header">
    <div class="cf-brand">
      <span class="cf-logo-mark">
        <img src="/assets/cresce-forte-icon.webp?v=1" alt="Cresce Forte">
      </span>
      <span class="cf-brand-name">Cresce Forte</span>
    </div>
    <div class="cf-user-area">
      <span class="cf-user-email" id="user-email"></span>
      <button type="button" class="cf-logout" id="logout-btn">Sair</button>
    </div>
  </header>

  <main class="cf-main">
    <h1>Suas ferramentas</h1>
    <p class="cf-sub">Escolha o que você quer acessar.</p>

    <div class="cf-modules" id="modules-area" aria-live="polite">
      <div class="cf-placeholder">
        <span class="cf-tag">Carregando</span>
        <h2>Módulos contratados</h2>
        <p>Buscando os serviços ativos da sua empresa...</p>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="/assets/auth.js?v=2"></script>
<script src="/assets/app.js"></script>
</body>
</html>
