<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=/app/">
<title>Redirecionando — Cresce Forte</title>
</head>
<body>
<!-- Protótipo antigo do portal, desativado — ver app.html para o portal real.

     Mesmo tratamento que Login.dc.html já havia recebido, e pelo mesmo
     motivo: este arquivo é servido estaticamente em cresceforte.com, então
     qualquer um que soubesse a URL abria a tela. E ele ainda carregava o
     mecanismo de "autenticação" antigo:

         var authed = localStorage.getItem('cf_auth_email') || '';
         if (!authed) { window.location.href = 'Login.dc.html'; }

     Ou seja: bastava abrir o console, gravar qualquer coisa em
     `cf_auth_email` e recarregar para "entrar". Não havia dado real por trás
     (era uma casca visual, sem backend), mas é exatamente o padrão de falha
     que o login de verdade veio substituir, publicado num domínio nosso —
     material pronto para uma página de phishing com URL legítima. O menu
     ainda apontava para Servicos.dc.html, arquivo que nunca existiu.

     Junto com ele saiu support.js (o runtime gerado do Claude Design, 71 KB),
     que não era usado por mais nenhuma página.

     Mantido como redirect em vez de apagado porque a URL pode estar salva ou
     compartilhada em algum lugar. -->
<script>location.href = '/app/';</script>
<p><a href="/app/">Clique aqui</a> se não for redirecionado automaticamente.</p>
</body>
</html>
