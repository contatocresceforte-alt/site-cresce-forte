<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="min-height:100vh;background:#eff4f5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;font-family:Inter,sans-serif">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#0d2b3e;margin-bottom:28px">
    <span style="width:32px;height:32px;border-radius:8px;flex-shrink:0;background:#fff;border:1px solid rgba(13,43,62,0.1);display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:0 1px 2px rgba(13,43,62,0.06)">
      <img src="assets/cresce-forte-icon.png" alt="Cresce Forte" style="width:100%;height:100%;object-fit:contain">
    </span>
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;letter-spacing:-0.01em;white-space:nowrap;flex-shrink:0">Cresce Forte</span>
  </a>

  <div style="width:100%;max-width:380px;background:#fff;border:1px solid rgba(13,43,62,0.1);border-radius:22px;padding:clamp(28px,5vw,36px);box-shadow:0 2px 6px -1px rgba(13,43,62,0.06),0 14px 32px -14px rgba(13,43,62,0.16)">
    <h1 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:#0d2b3e;margin:0 0 6px">Entrar no seu painel</h1>
    <p style="font-size:14px;line-height:1.55;color:#56707e;margin:0 0 24px">Acesse o menu com as ferramentas da sua empresa.</p>

    <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
      <div style="background:rgba(200,60,40,0.08);border:1px solid rgba(200,60,40,0.25);color:#a13a2a;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:16px">{{ error }}</div>
    </sc-if>

    <form onSubmit="{{ onSubmit }}" style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="font-size:13px;font-weight:600;color:#3d5768;margin-bottom:6px;display:block">E-mail</label>
        <input type="email" required="" value="{{ email }}" onChange="{{ onEmail }}" placeholder="seuemail@empresa.com" style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(13,43,62,0.15);font-size:14.5px;font-family:Inter,sans-serif;color:#0d2b3e;background:#fff"></input>
      </div>
      <div>
        <label style="font-size:13px;font-weight:600;color:#3d5768;margin-bottom:6px;display:block">Senha</label>
        <input type="password" required="" value="{{ password }}" onChange="{{ onPassword }}" placeholder="••••••••" style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(13,43,62,0.15);font-size:14.5px;font-family:Inter,sans-serif;color:#0d2b3e;background:#fff"></input>
      </div>
      <button type="submit" style="margin-top:4px;font-size:14.5px;font-weight:700;min-height:48px;border-radius:999px;border:none;background:#7cb602;color:#0a2536;cursor:pointer" style-hover="background:#8dc90a">Entrar</button>
    </form>
  </div>

  <a href="index.html" style="margin-top:24px;font-size:13.5px;color:#56707e;text-decoration:none" style-hover="color:#0d2b3e">← Voltar ao site</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', password: '', error: '' };

  onEmail(e) { this.setState({ email: e.target.value, error: '' }); }
  onPassword(e) { this.setState({ password: e.target.value, error: '' }); }

  onSubmit(e) {
    e.preventDefault();
    if (this.state.email === 'alainsteven007@gmail.com' && this.state.password === 'admin123') {
      try { localStorage.setItem('cf_auth_email', this.state.email); } catch (err) {}
      window.location.href = 'Dashboard.dc.html';
    } else {
      this.setState({ error: 'E-mail ou senha incorretos.' });
    }
  }

  renderVals() {
    return {
      email: this.state.email,
      password: this.state.password,
      error: this.state.error,
      hasError: !!this.state.error,
      onEmail: this.onEmail.bind(this),
      onPassword: this.onPassword.bind(this),
      onSubmit: this.onSubmit.bind(this)
    };
  }
}
</script>
</body>
</html>
