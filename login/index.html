<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Cresce Forte</title>
<meta name="description" content="Acesse o painel da sua empresa na Cresce Forte.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/cresce-forte-icon.webp?v=1" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/auth-card.css?v=2">
<style>
  .cf-forgot {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    padding: 0;
    font-size: 13.5px;
    font-family: Inter, sans-serif;
    color: #56707e;
    text-decoration: underline;
    cursor: pointer;
  }
  .cf-forgot:hover { color: #0d2b3e; }
  .cf-forgot:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<div class="cf-page">
  <a href="/" class="cf-logo">
    <span class="cf-logo-mark">
      <img src="/assets/cresce-forte-icon.webp?v=1" alt="Cresce Forte">
    </span>
    <span class="cf-logo-name">Cresce Forte</span>
  </a>

  <div class="cf-card">
    <h1>Entrar no seu painel</h1>
    <p class="cf-sub">Acesse o menu com as ferramentas da sua empresa.</p>

    <div class="cf-error" id="error-box" role="alert" hidden></div>
    <div class="cf-success" id="success-box" role="status" hidden></div>

    <form class="cf-form" id="login-form" novalidate>
      <div class="cf-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="seuemail@empresa.com">
      </div>
      <div class="cf-field">
        <label for="password">Senha</label>
        <div class="cf-pwd-wrap">
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="cf-pwd-toggle" id="password-toggle" aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="cf-submit" id="submit-btn">Entrar</button>
    </form>

    <button type="button" class="cf-forgot" id="forgot-btn">Esqueci minha senha</button>
  </div>

  <a href="/" class="cf-back">← Voltar ao site</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/auth.js"></script>
<script>
(function () {
  var form = document.getElementById('login-form');
  var emailInput = document.getElementById('email');
  var passwordInput = document.getElementById('password');
  var submitBtn = document.getElementById('submit-btn');
  var forgotBtn = document.getElementById('forgot-btn');
  var errorBox = document.getElementById('error-box');
  var successBox = document.getElementById('success-box');
  var passwordToggle = document.getElementById('password-toggle');

  // Eye icon: same SVG element, swap only the inner path/circle on toggle.
  var EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>';
  var EYE_OFF = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.34M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  passwordToggle.addEventListener('click', function () {
    var show = passwordInput.type === 'password';
    passwordInput.type = show ? 'text' : 'password';
    passwordToggle.setAttribute('aria-pressed', String(show));
    passwordToggle.setAttribute('aria-label', show ? 'Esconder senha' : 'Mostrar senha');
    passwordToggle.querySelector('svg').innerHTML = show ? EYE_OFF : EYE_OPEN;
  });

  function showError(message) {
    successBox.hidden = true;
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = '';
  }

  function showSuccess(message) {
    errorBox.hidden = true;
    successBox.textContent = message;
    successBox.hidden = false;
  }

  function routeForUserType(userType) {
    window.location.href = userType === 'PLATFORM' ? '/admin/' : '/app/';
  }

  // If already signed in, skip the form and go straight to the right place.
  CresceForteAuth.getSession().then(function (session) {
    if (session) {
      routeForUserType(CresceForteAuth.getUserType(session));
    }
  });

  emailInput.addEventListener('input', clearError);
  passwordInput.addEventListener('input', clearError);

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();

    var email = emailInput.value.trim();
    var password = passwordInput.value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';

    try {
      var result = await CresceForteAuth.client.auth.signInWithPassword({ email: email, password: password });
      if (result.error) {
        showError('E-mail ou senha incorretos.');
        return;
      }
      var user = result.data && result.data.user;
      var userType = user && user.app_metadata ? user.app_metadata.user_type : undefined;
      routeForUserType(userType);
    } catch (err) {
      console.error('Login error:', err);
      showError('Não foi possível entrar agora. Tente novamente em instantes.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
    }
  });

  forgotBtn.addEventListener('click', async function () {
    var email = emailInput.value.trim();
    if (!email) {
      showError('Digite seu e-mail acima antes de pedir a recuperação de senha.');
      emailInput.focus();
      return;
    }

    forgotBtn.disabled = true;
    forgotBtn.textContent = 'Enviando...';

    try {
      var result = await CresceForteAuth.client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password/'
      });
      if (result.error) {
        showError('Não foi possível enviar o e-mail de recuperação agora. Tente novamente em instantes.');
        return;
      }
      showSuccess('Se ' + email + ' tiver uma conta, enviamos um link para redefinir a senha.');
    } catch (err) {
      console.error('Reset password request error:', err);
      showError('Não foi possível enviar o e-mail de recuperação agora. Tente novamente em instantes.');
    } finally {
      forgotBtn.disabled = false;
      forgotBtn.textContent = 'Esqueci minha senha';
    }
  });
})();
</script>
</body>
</html>
