<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Cresce Forte</title>
<meta name="description" content="Acesse o painel da sua empresa na Cresce Forte.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/cresce-forte-icon.webp?v=1" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .cf-page {
    min-height: 100vh;
    background: #eff4f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: Inter, sans-serif;
  }
  .cf-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #0d2b3e;
    margin-bottom: 28px;
  }
  .cf-logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    background: #fff;
    border: 1px solid rgba(13,43,62,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    box-shadow: 0 1px 2px rgba(13,43,62,0.06);
  }
  .cf-logo-mark img { width: 100%; height: 100%; object-fit: contain; }
  .cf-logo-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cf-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border: 1px solid rgba(13,43,62,0.1);
    border-radius: 22px;
    padding: clamp(28px, 5vw, 36px);
    box-shadow: 0 2px 6px -1px rgba(13,43,62,0.06), 0 14px 32px -14px rgba(13,43,62,0.16);
  }
  .cf-card h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #0d2b3e;
    margin: 0 0 6px;
  }
  .cf-card p.cf-sub {
    font-size: 14px;
    line-height: 1.55;
    color: #56707e;
    margin: 0 0 24px;
  }
  .cf-error {
    background: rgba(200,60,40,0.08);
    border: 1px solid rgba(200,60,40,0.25);
    color: #a13a2a;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  .cf-error[hidden] { display: none; }
  .cf-success {
    background: rgba(124,182,2,0.1);
    border: 1px solid rgba(124,182,2,0.35);
    color: #4a6b06;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  .cf-success[hidden] { display: none; }
  form.cf-form { display: flex; flex-direction: column; gap: 16px; }
  .cf-field label {
    font-size: 13px;
    font-weight: 600;
    color: #3d5768;
    margin-bottom: 6px;
    display: block;
  }
  .cf-field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(13,43,62,0.15);
    font-size: 14.5px;
    font-family: Inter, sans-serif;
    color: #0d2b3e;
    background: #fff;
  }
  .cf-field input:focus {
    outline: none;
    border-color: rgba(124,182,2,0.6);
    box-shadow: 0 0 0 3px rgba(124,182,2,0.15);
  }
  .cf-submit {
    margin-top: 4px;
    font-size: 14.5px;
    font-weight: 700;
    min-height: 48px;
    border-radius: 999px;
    border: none;
    background: #7cb602;
    color: #0a2536;
    cursor: pointer;
    font-family: Inter, sans-serif;
  }
  .cf-submit:hover:not(:disabled) { background: #8dc90a; }
  .cf-submit:disabled { opacity: 0.65; cursor: default; }
  .cf-back {
    margin-top: 24px;
    font-size: 13.5px;
    color: #56707e;
    text-decoration: none;
  }
  .cf-back:hover { color: #0d2b3e; }
  .cf-forgot {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    padding: 0;
    font-size: 13.5px;
    font-family: Inter, sans-serif;
    color: #56707e;
    text-decoration: underline;
    cursor: pointer;
  }
  .cf-forgot:hover { color: #0d2b3e; }
  .cf-forgot:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<div class="cf-page">
  <a href="/" class="cf-logo">
    <span class="cf-logo-mark">
      <img src="/assets/cresce-forte-icon.webp?v=1" alt="Cresce Forte">
    </span>
    <span class="cf-logo-name">Cresce Forte</span>
  </a>

  <div class="cf-card">
    <h1>Entrar no seu painel</h1>
    <p class="cf-sub">Acesse o menu com as ferramentas da sua empresa.</p>

    <div class="cf-error" id="error-box" hidden></div>
    <div class="cf-success" id="success-box" hidden></div>

    <form class="cf-form" id="login-form" novalidate>
      <div class="cf-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="seuemail@empresa.com">
      </div>
      <div class="cf-field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="cf-submit" id="submit-btn">Entrar</button>
    </form>

    <button type="button" class="cf-forgot" id="forgot-btn">Esqueci minha senha</button>
  </div>

  <a href="/" class="cf-back">← Voltar ao site</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/auth.js"></script>
<script>
(function () {
  var form = document.getElementById('login-form');
  var emailInput = document.getElementById('email');
  var passwordInput = document.getElementById('password');
  var submitBtn = document.getElementById('submit-btn');
  var forgotBtn = document.getElementById('forgot-btn');
  var errorBox = document.getElementById('error-box');
  var successBox = document.getElementById('success-box');

  function showError(message) {
    successBox.hidden = true;
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = '';
  }

  function showSuccess(message) {
    errorBox.hidden = true;
    successBox.textContent = message;
    successBox.hidden = false;
  }

  function routeForUserType(userType) {
    window.location.href = userType === 'PLATFORM' ? '/admin/' : '/app/';
  }

  // If already signed in, skip the form and go straight to the right place.
  CresceForteAuth.getSession().then(function (session) {
    if (session) {
      routeForUserType(CresceForteAuth.getUserType(session));
    }
  });

  emailInput.addEventListener('input', clearError);
  passwordInput.addEventListener('input', clearError);

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();

    var email = emailInput.value.trim();
    var password = passwordInput.value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';

    try {
      var result = await CresceForteAuth.client.auth.signInWithPassword({ email: email, password: password });
      if (result.error) {
        showError('E-mail ou senha incorretos.');
        return;
      }
      var user = result.data && result.data.user;
      var userType = user && user.app_metadata ? user.app_metadata.user_type : undefined;
      routeForUserType(userType);
    } catch (err) {
      console.error('Login error:', err);
      showError('Não foi possível entrar agora. Tente novamente em instantes.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
    }
  });

  forgotBtn.addEventListener('click', async function () {
    var email = emailInput.value.trim();
    if (!email) {
      showError('Digite seu e-mail acima antes de pedir a recuperação de senha.');
      emailInput.focus();
      return;
    }

    forgotBtn.disabled = true;
    forgotBtn.textContent = 'Enviando...';

    try {
      var result = await CresceForteAuth.client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password/'
      });
      if (result.error) {
        showError('Não foi possível enviar o e-mail de recuperação agora. Tente novamente em instantes.');
        return;
      }
      showSuccess('Se ' + email + ' tiver uma conta, enviamos um link para redefinir a senha.');
    } catch (err) {
      console.error('Reset password request error:', err);
      showError('Não foi possível enviar o e-mail de recuperação agora. Tente novamente em instantes.');
    } finally {
      forgotBtn.disabled = false;
      forgotBtn.textContent = 'Esqueci minha senha';
    }
  });
})();
</script>
</body>
</html>
