<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefinir senha — Cresce Forte</title>
<meta name="description" content="Redefina a senha de acesso à sua conta Cresce Forte.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/cresce-forte-icon.webp?v=1" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/auth-card.css">
<style>
  form.cf-form[hidden] { display: none; }
  .cf-rules {
    list-style: none;
    margin: -8px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .cf-rules li {
    font-size: 12.5px;
    color: #7c96a3;
    padding-left: 20px;
    position: relative;
  }
  .cf-rules li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 3px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 1.5px solid rgba(13,43,62,0.2);
    box-sizing: border-box;
  }
  .cf-rules li.cf-rule-ok { color: #4a6b06; }
  .cf-rules li.cf-rule-ok::before { border-color: #7cb602; background: #7cb602; }
</style>
</head>
<body>
<div class="cf-page">
  <a href="/" class="cf-logo">
    <span class="cf-logo-mark">
      <img src="/assets/cresce-forte-icon.webp?v=1" alt="Cresce Forte">
    </span>
    <span class="cf-logo-name">Cresce Forte</span>
  </a>

  <div class="cf-card">
    <h1 id="card-title">Redefinir senha</h1>
    <p class="cf-sub" id="card-sub">Confirmando seu link de recuperação...</p>

    <div class="cf-error" id="error-box" role="alert" hidden></div>
    <div class="cf-success" id="success-box" role="status" hidden></div>

    <form class="cf-form" id="reset-form" novalidate hidden>
      <div class="cf-field">
        <label for="password">Nova senha</label>
        <div class="cf-pwd-wrap">
          <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="••••••••" minlength="8">
          <button type="button" class="cf-pwd-toggle" id="password-toggle" aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <ul class="cf-rules" id="password-rules"></ul>
      <div class="cf-field">
        <label for="password-confirm">Confirme a nova senha</label>
        <div class="cf-pwd-wrap">
          <input type="password" id="password-confirm" name="password-confirm" required autocomplete="new-password" placeholder="••••••••" minlength="8">
          <button type="button" class="cf-pwd-toggle" id="password-confirm-toggle" aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="cf-submit" id="submit-btn">Salvar nova senha</button>
    </form>
  </div>

  <a href="/login/" class="cf-back">← Voltar para o login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/auth.js"></script>
<script>
(function () {
  var titleEl = document.getElementById('card-title');
  var subEl = document.getElementById('card-sub');
  var form = document.getElementById('reset-form');
  var passwordInput = document.getElementById('password');
  var passwordConfirmInput = document.getElementById('password-confirm');
  var submitBtn = document.getElementById('submit-btn');
  var errorBox = document.getElementById('error-box');
  var successBox = document.getElementById('success-box');
  var rulesList = document.getElementById('password-rules');

  // Eye icon toggle, wired the same way for both password fields.
  var EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>';
  var EYE_OFF = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.34M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  function wirePasswordToggle(input, button) {
    button.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      button.setAttribute('aria-pressed', String(show));
      button.setAttribute('aria-label', show ? 'Esconder senha' : 'Mostrar senha');
      button.querySelector('svg').innerHTML = show ? EYE_OFF : EYE_OPEN;
    });
  }
  wirePasswordToggle(passwordInput, document.getElementById('password-toggle'));
  wirePasswordToggle(passwordConfirmInput, document.getElementById('password-confirm-toggle'));

  // Same rules the Supabase Auth password policy enforces server-side —
  // shown and checked live so the user sees what's missing before submitting,
  // not just a rejection after the fact.
  var PASSWORD_RULES = [
    { test: function (p) { return p.length >= 8; }, label: 'Mínimo de 8 caracteres' },
    { test: function (p) { return /[a-z]/.test(p); }, label: 'Uma letra minúscula' },
    { test: function (p) { return /[A-Z]/.test(p); }, label: 'Uma letra maiúscula' },
    { test: function (p) { return /[^A-Za-z0-9]/.test(p); }, label: 'Um caractere especial (ex: !@#$%)' }
  ];
  PASSWORD_RULES.forEach(function (rule) {
    var li = document.createElement('li');
    li.textContent = rule.label;
    rulesList.appendChild(li);
  });
  function updateRules() {
    var password = passwordInput.value;
    PASSWORD_RULES.forEach(function (rule, i) {
      rulesList.children[i].classList.toggle('cf-rule-ok', rule.test(password));
    });
  }
  function passwordMeetsRules(password) {
    return PASSWORD_RULES.every(function (rule) { return rule.test(password); });
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = '';
  }

  function routeForUserType(userType) {
    window.location.href = userType === 'PLATFORM' ? '/admin/' : '/app/';
  }

  // Supabase's recovery link puts a token in the URL and, once the client
  // library picks it up, fires PASSWORD_RECOVERY with a real (but
  // short-lived) session — that's our cue to show the "set new password"
  // form instead of the default "confirming..." message.
  var recoveryReady = false;

  CresceForteAuth.client.auth.onAuthStateChange(function (event, session) {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
      subEl.textContent = 'Escolha uma nova senha para sua conta.';
      form.hidden = false;
      return;
    }

    // This page doubles as the Site URL, so any other flow that lands here
    // with a valid session (e.g. confirming a brand-new signup) isn't a
    // password reset — just send them where they'd normally end up.
    if (event === 'SIGNED_IN' && !recoveryReady && session) {
      routeForUserType(CresceForteAuth.getUserType(session));
    }
  });

  // If the link was already invalid/expired, Supabase redirects here with
  // #error=... instead of a session — surface that instead of hanging on
  // "confirming...".
  var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (hashParams.get('error')) {
    titleEl.textContent = 'Link inválido';
    subEl.textContent = 'Esse link de recuperação expirou ou já foi usado. Peça um novo.';
    showError(hashParams.get('error_description') ? hashParams.get('error_description').replace(/\+/g, ' ') : 'Link inválido ou expirado.');
  } else {
    // Give onAuthStateChange a moment to fire before assuming there is no token at all.
    setTimeout(function () {
      if (!recoveryReady && form.hidden) {
        titleEl.textContent = 'Link inválido';
        subEl.textContent = 'Abra esta página a partir do link enviado por e-mail.';
      }
    }, 4000);
  }

  passwordInput.addEventListener('input', function () { clearError(); updateRules(); });
  passwordConfirmInput.addEventListener('input', clearError);

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();

    var password = passwordInput.value;
    var confirm = passwordConfirmInput.value;

    if (!passwordMeetsRules(password)) {
      showError('A senha não atende aos requisitos listados acima.');
      return;
    }
    if (password !== confirm) {
      showError('As senhas não conferem.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Salvando...';

    try {
      var result = await CresceForteAuth.client.auth.updateUser({ password: password });
      if (result.error) {
        showError('Não foi possível salvar a nova senha: ' + result.error.message);
        return;
      }
      form.hidden = true;
      successBox.hidden = false;
      successBox.textContent = 'Senha atualizada! Redirecionando...';

      var user = result.data && result.data.user;
      var userType = user && user.app_metadata ? user.app_metadata.user_type : undefined;
      setTimeout(function () { routeForUserType(userType); }, 1500);
    } catch (err) {
      console.error('Reset password error:', err);
      showError('Não foi possível salvar a nova senha agora. Tente novamente em instantes.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Salvar nova senha';
    }
  });
})();
</script>
</body>
</html>
