<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Cresce Forte</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/cresce-forte-icon.webp?v=1" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .cf-page {
    min-height: 100vh;
    background: #eff4f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: Inter, sans-serif;
    text-align: center;
  }
  .cf-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #0d2b3e;
    margin-bottom: 28px;
  }
  .cf-logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    background: #fff;
    border: 1px solid rgba(13,43,62,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    box-shadow: 0 1px 2px rgba(13,43,62,0.06);
  }
  .cf-logo-mark img { width: 100%; height: 100%; object-fit: contain; }
  .cf-logo-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cf-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid rgba(13,43,62,0.1);
    border-radius: 22px;
    padding: clamp(28px, 5vw, 40px);
    box-shadow: 0 2px 6px -1px rgba(13,43,62,0.06), 0 14px 32px -14px rgba(13,43,62,0.16);
  }
  .cf-404 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 56px;
    color: #7cb602;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .cf-card h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: #0d2b3e;
    margin: 0 0 10px;
  }
  .cf-card p {
    font-size: 14px;
    line-height: 1.55;
    color: #56707e;
    margin: 0 0 24px;
  }
  .cf-submit {
    display: inline-block;
    font-size: 14.5px;
    font-weight: 700;
    min-height: 48px;
    line-height: 48px;
    padding: 0 28px;
    border-radius: 999px;
    border: none;
    background: #7cb602;
    color: #0a2536;
    text-decoration: none;
    font-family: Inter, sans-serif;
  }
  .cf-submit:hover { background: #8dc90a; }
</style>
</head>
<body>
<div class="cf-page">
  <a href="/" class="cf-logo">
    <span class="cf-logo-mark">
      <img src="/assets/cresce-forte-icon.webp?v=1" alt="Cresce Forte">
    </span>
    <span class="cf-logo-name">Cresce Forte</span>
  </a>

  <div class="cf-card">
    <p class="cf-404">404</p>
    <h1>Essa página não existe</h1>
    <p>O link pode estar errado ou a página foi movida. Volta pra página inicial pra continuar.</p>
    <a href="/" class="cf-submit">Voltar ao início</a>
  </div>
</div>
</body>
</html>
